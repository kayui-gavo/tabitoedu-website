name: Decode Tokyo Science assets

on:
  push:
    branches: [gh-pages]
    paths:
      - 'site/images/tokyo-science-2026/_payload/**'
      - '.github/workflows/decode-tokyo-science-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Decode image payloads
        shell: bash
        run: |
          set -euo pipefail
          payload='site/images/tokyo-science-2026/_payload'
          out='site/images/tokyo-science-2026'
          mkdir -p "$out"

          decode_clean() {
            tr -cd 'A-Za-z0-9+/=' | base64 -d
          }

          shopt -s nullglob
          for f in "$payload"/*.webp.b64; do
            base="$(basename "$f" .b64)"
            decode_clean < "$f" > "$out/$base"
          done

          declare -A seen=()
          for f in "$payload"/*.webp.b64.part*; do
            stem="${f%.part*}"
            seen["$stem"]=1
          done
          for stem in "${!seen[@]}"; do
            base="$(basename "$stem" .b64)"
            cat "${stem}".part* | decode_clean > "$out/$base"
          done

          file "$out"/*.webp

      - name: Commit decoded WebP assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/images/tokyo-science-2026/*.webp
          if git diff --cached --quiet; then
            echo 'No decoded asset changes.'
            exit 0
          fi
          git commit -m 'Decode Tokyo Science 2026 image assets'
          git push origin HEAD:gh-pages
