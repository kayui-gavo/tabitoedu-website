name: Decode Tokyo Science assets

on:
  push:
    branches: [gh-pages]
    paths:
      - 'site/images/tokyo-science-2026/_payload/**'
      - '.github/workflows/decode-tokyo-science-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Decode valid image payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re

          payload = Path('site/images/tokyo-science-2026/_payload')
          out = Path('site/images/tokyo-science-2026')
          out.mkdir(parents=True, exist_ok=True)

          groups = {}
          for p in payload.glob('*.webp.b64'):
              groups[p.name[:-4]] = [p]
          for p in payload.glob('*.webp.b64.part*'):
              stem = p.name.split('.part', 1)[0]
              groups.setdefault(stem, []).append(p)

          for stem, parts in sorted(groups.items()):
              parts = sorted(parts)
              text = ''.join(p.read_text(errors='ignore') for p in parts)
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              clean += '=' * ((-len(clean)) % 4)
              try:
                  data = base64.b64decode(clean, validate=False)
              except Exception as exc:
                  print(f'SKIP {stem}: decode failed: {exc}')
                  continue
              if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  print(f'SKIP {stem}: not a WebP payload')
                  continue
              declared = int.from_bytes(data[4:8], 'little') + 8
              if len(data) < declared:
                  print(f'SKIP {stem}: incomplete payload ({len(data)} < {declared} bytes)')
                  continue
              target = out / stem.replace('.b64', '')
              target.write_bytes(data[:declared])
              print(f'OK   {target} ({declared} bytes)')
          PY

          find site/images/tokyo-science-2026 -maxdepth 1 -name '*.webp' -print -exec file {} \;

      - name: Commit decoded WebP assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/images/tokyo-science-2026/*.webp 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No decoded asset changes.'
            exit 0
          fi
          git commit -m 'Decode valid Tokyo Science 2026 image assets'
          git push origin HEAD:gh-pages
