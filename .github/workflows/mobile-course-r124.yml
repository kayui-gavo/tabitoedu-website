name: Apply mobile course loader r124

on:
  push:
    branches: [preview-r40]
    paths:
      - '.github/workflows/mobile-course-r124.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-r40
      - name: Inject mobile-only stylesheet loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          loader = """
  if(!document.querySelector('link[data-course-mobile-r124]')){
    const mobile=document.createElement('link');
    mobile.rel='stylesheet';
    mobile.href='course-mobile-r124.css?v=20260828r124';
    mobile.media='(max-width:820px)';
    mobile.dataset.courseMobileR124='';
    document.head.append(mobile);
  }
"""

          # Art and Common Test already inject their consolidated visual stylesheet.
          # Place the mobile layer after that injection so it remains the final mobile override.
          for name in ['site/art-r99.js', 'site/kyotsu-r97.js']:
              p = Path(name)
              s = p.read_text()
              if 'data-course-mobile-r124' in s:
                  continue
              marker = "    document.head.append(style);\n  }\n"
              if marker not in s:
                  raise SystemExit(f'marker not found in {name}')
              s = s.replace(marker, marker + loader, 1)
              p.write_text(s)

          # EJU and School share this detail script; their page-specific CSS is already in <head>.
          p = Path('site/course-detail-r110.js')
          s = p.read_text()
          if 'data-course-mobile-r124' not in s:
              marker = "  document.documentElement.dataset.courseDetailR110='1';\n"
              if marker not in s:
                  raise SystemExit('marker not found in course-detail-r110.js')
              s = s.replace(marker, marker + loader, 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/art-r99.js site/kyotsu-r97.js site/course-detail-r110.js
          git diff --cached --quiet && exit 0
          git commit -m 'Load shared mobile course UI r124 [skip ci]'
          git push origin HEAD:preview-r40
