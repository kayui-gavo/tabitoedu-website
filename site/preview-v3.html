<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅人教育 TABITO｜官网精修预览</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f8fb;overflow:hidden}
#preview{display:block;width:100%;height:100vh;border:0;background:white;visibility:hidden;opacity:0;transition:opacity .14s ease}
#preview.is-ready{visibility:visible;opacity:1}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f8fb;color:#496878;font:600 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;z-index:2}
#loading.is-hidden{display:none}
</style>
</head>
<body>
<div id="loading">正在载入旅人教育官网…</div>
<iframe id="preview" src="index.html" title="旅人教育官网精修预览"></iframe>
<script>
const frame=document.getElementById('preview');
const loading=document.getElementById('loading');

frame.addEventListener('load', async ()=>{
  try{
    const doc=frame.contentDocument;
    const v='20260823r17noflash1';

    const addCss=(href)=>new Promise(resolve=>{
      const x=doc.createElement('link');
      x.rel='stylesheet';
      x.href=href;
      x.addEventListener('load',resolve,{once:true});
      x.addEventListener('error',resolve,{once:true});
      doc.head.appendChild(x);
    });

    const addJs=(src)=>new Promise(resolve=>{
      const x=doc.createElement('script');
      x.src=src;
      x.addEventListener('load',resolve,{once:true});
      x.addEventListener('error',resolve,{once:true});
      doc.body.appendChild(x);
    });

    await Promise.all([
      'polish-v3.css','polish-v3-hotfix.css','polish-v4-flow.css','polish-v5-editorial.css',
      'polish-v6-evidence.css','polish-v7-professional.css','polish-v7-fix.css','polish-v8-baijin.css',
      'polish-v8-fix.css','polish-v9-cool.css','polish-v10-density.css','polish-v10-fix.css',
      'polish-v11-audit.css','polish-finishing.css'
    ].map(file=>addCss(file+'?v='+v)));

    for(const file of [
      'polish-v3.js','polish-v3-hotfix.js','polish-v4-flow.js','polish-v5-editorial.js','polish-v5-detail.js',
      'polish-v6-evidence.js','polish-v7-professional.js','polish-v8-baijin.js','polish-v8-fix.js',
      'polish-v9-cool.js','polish-v10-density.js','polish-v11-audit.js','polish-finishing.js'
    ]){
      await addJs(file+'?v='+v);
    }

    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      frame.classList.add('is-ready');
      loading.classList.add('is-hidden');
    }));
  }catch(err){
    loading.textContent='预览载入失败，请刷新页面重试。';
    console.error(err);
  }
});
</script>
</body>
</html>
