<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅人教育 TABITO｜Preserve + Polish v3 Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;background:#f6f4ef;overflow:hidden}
#preview{display:block;width:100%;height:100vh;border:0;background:white}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f6f4ef;color:#49606f;font:600 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;z-index:2}
</style>
</head>
<body>
<div id="loading">正在载入完整现行官网，并叠加 v3 精修层…</div>
<iframe id="preview" src="index.html" title="旅人教育完整官网 v3 精修预览"></iframe>
<script>
const frame=document.getElementById('preview');
const loading=document.getElementById('loading');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const css=doc.createElement('link');
    css.rel='stylesheet'; css.href='polish-v3.css?v=20260821b';
    doc.head.appendChild(css);
    const js=doc.createElement('script');
    js.src='polish-v3.js?v=20260821b';
    doc.body.appendChild(js);
    loading.remove();
  }catch(err){
    loading.textContent='预览层载入失败。';
    console.error(err);
  }
});
</script>
</body>
</html>
