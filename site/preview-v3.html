<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅人教育 TABITO｜Preserve + Polish Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;background:#f6f4ef;overflow:hidden}
#preview{display:block;width:100%;height:100vh;border:0;background:white}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f6f4ef;color:#49606f;font:600 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;z-index:2}
</style>
</head>
<body>
<div id="loading">正在载入完整现行官网，并叠加最新精修层…</div>
<iframe id="preview" src="index.html" title="旅人教育完整官网精修预览"></iframe>
<script>
const frame=document.getElementById('preview');
const loading=document.getElementById('loading');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const addCss=(href)=>{const x=doc.createElement('link');x.rel='stylesheet';x.href=href;doc.head.appendChild(x)};
    const addJs=(src,onload)=>{const x=doc.createElement('script');x.src=src;if(onload)x.addEventListener('load',onload);doc.body.appendChild(x)};
    addCss('polish-v3.css?v=20260822d');
    addCss('polish-v3-hotfix.css?v=20260822d');
    addCss('polish-v4-flow.css?v=20260822d');
    addCss('polish-v5-editorial.css?v=20260822d');
    addJs('polish-v3.js?v=20260822d',()=>{
      addJs('polish-v3-hotfix.js?v=20260822d',()=>{
        addJs('polish-v4-flow.js?v=20260822d',()=>{
          addJs('polish-v5-editorial.js?v=20260822d');
        });
      });
    });
    loading.remove();
  }catch(err){
    loading.textContent='预览层载入失败，请通过 HTTP 方式打开本页面。';
    console.error(err);
  }
});
</script>
</body>
</html>
