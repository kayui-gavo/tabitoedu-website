<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旅人教育 TABITO｜Preserve + Polish Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;width:100%;height:100%;background:#f4f8fb;overflow:hidden}
#preview{display:block;width:100%;height:100vh;border:0;background:white}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#f4f8fb;color:#496878;font:600 14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;z-index:2}
</style>
</head>
<body>
<div id="loading">正在载入完整现行官网，并叠加最新精修层…</div>
<iframe id="preview" src="index.html" title="旅人教育完整官网精修预览"></iframe>
<script>
const frame=document.getElementById('preview');
const loading=document.getElementById('loading');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const addCss=(href)=>{const x=doc.createElement('link');x.rel='stylesheet';x.href=href;doc.head.appendChild(x)};
    const addJs=(src,onload)=>{const x=doc.createElement('script');x.src=src;if(onload)x.addEventListener('load',onload);doc.body.appendChild(x)};
    const v='20260823r13home1';
    addCss('polish-v3.css?v='+v);
    addCss('polish-v3-hotfix.css?v='+v);
    addCss('polish-v4-flow.css?v='+v);
    addCss('polish-v5-editorial.css?v='+v);
    addCss('polish-v6-evidence.css?v='+v);
    addCss('polish-v7-professional.css?v='+v);
    addCss('polish-v7-fix.css?v='+v);
    addCss('polish-v8-baijin.css?v='+v);
    addCss('polish-v8-fix.css?v='+v);
    addCss('polish-v9-cool.css?v='+v);
    addCss('polish-v10-density.css?v='+v);
    addCss('polish-v10-fix.css?v='+v);
    addCss('polish-v11-audit.css?v='+v);
    addCss('polish-finishing.css?v='+v);
    addJs('polish-v3.js?v='+v,()=>{
      addJs('polish-v3-hotfix.js?v='+v,()=>{
        addJs('polish-v4-flow.js?v='+v,()=>{
          addJs('polish-v5-editorial.js?v='+v,()=>{
            addJs('polish-v5-detail.js?v='+v,()=>{
              addJs('polish-v6-evidence.js?v='+v,()=>{
                addJs('polish-v7-professional.js?v='+v,()=>{
                  addJs('polish-v8-baijin.js?v='+v,()=>{
                    addJs('polish-v8-fix.js?v='+v,()=>{
                      addJs('polish-v9-cool.js?v='+v,()=>{
                        addJs('polish-v10-density.js?v='+v,()=>{
                          addJs('polish-v11-audit.js?v='+v,()=>{
                            addJs('polish-finishing.js?v='+v);
                          });
                        });
                      });
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
    loading.remove();
  }catch(err){
    loading.textContent='预览层载入失败，请通过 HTTP 方式打开本页面。';
    console.error(err);
  }
});
</script>
</body>
</html>
