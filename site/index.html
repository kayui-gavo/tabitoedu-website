<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="旅人教育 TABITO｜面向中国学生的日本本科升学指导。共通考试、EJU 一对一、校内考、美术升学。">
  <meta name="theme-color" content="#12384d">
  <title>旅人教育 TABITO｜日本本科升学指导</title>
  <link rel="icon" href="images/logo1.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css?v=20260824r20cleanindex1">
  <style>
    *,*::before,*::after{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f8fa}body{padding-top:64px}
    nav.fixed{position:fixed;inset:0 0 auto 0;z-index:100;height:64px}.nav-inner{height:64px;display:flex;align-items:center;justify-content:space-between;width:min(1240px,calc(100% - 32px));margin:0 auto}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#12384d}.brand img{height:38px;width:auto}.brand span{font-size:18px;font-weight:800}.hidden.md\:flex{display:flex}.mobile-trigger{display:none;border:0;background:transparent;padding:8px}.mobile-trigger span{display:block;width:22px;height:2px;background:#12384d;margin:4px 0}.mobile-menu{display:none;background:#fff;border-top:1px solid #dce6ea;padding:8px 16px 16px}.mobile-menu.is-open{display:block}.mobile-menu .flex.flex-col{display:flex;flex-direction:column}.page-section{display:none}.page-section.active{display:block}.site-footer{padding:26px 24px;background:#f1f5f7;border-top:1px solid #dce6ea;color:#667d89;font:13px/1.7 'Noto Sans SC',sans-serif}.site-footer>div{width:min(1160px,100%);margin:auto;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
    @media(max-width:820px){.hidden.md\:flex{display:none!important}.mobile-trigger{display:block}.brand span{font-size:16px}body{padding-top:60px}nav.fixed,.nav-inner{height:60px}}
  </style>
  <script src="site.js?v=20260824r20cleanindex1" defer></script>
</head>
<body>
  <nav class="fixed" aria-label="主导航">
    <div class="nav-inner max-w-7xl">
      <a class="brand" href="#" data-home-target="top" aria-label="旅人教育 TABITO 首页">
        <img src="images/logo1.png" alt="旅人教育 TABITO">
        <span class="text-2xl">旅人教育 TABITO</span>
      </a>
      <div class="hidden md:flex" aria-label="桌面导航"></div>
      <button class="mobile-trigger" id="mobileMenuBtn" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
    <div id="mobileMenu" class="mobile-menu"><div class="flex flex-col"></div></div>
  </nav>

  <main id="home" class="page-section active" aria-live="polite"></main>

  <footer class="site-footer">
    <div>
      <span>中国旅人教育集团株式会社</span>
      <span>〒164-0001 東京都中野区中野1-55-3 フェリスビル 4F</span>
      <span>© 2026 TABITO Education</span>
    </div>
  </footer>

  <script>
    (()=>{
      const btn=document.getElementById('mobileMenuBtn');
      const menu=document.getElementById('mobileMenu');
      btn?.addEventListener('click',()=>{
        const open=menu.classList.toggle('is-open');
        btn.setAttribute('aria-expanded',String(open));
      });
      window.toggleMobileMenu=()=>{
        if(!menu)return;
        const open=menu.classList.toggle('is-open');
        btn?.setAttribute('aria-expanded',String(open));
      };
    })();
  </script>
</body>
</html>
